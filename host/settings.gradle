pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
			}
		}
		maven {
			name = 'NeoForged'
			url = uri('https://maven.neoforged.net/releases')
		}
	}
}

plugins {
	// Finds or downloads the JDK build.gradle's toolchain asks for, so a machine without a JDK 25
	// still builds, and the CI builds with the same one.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'craftkit'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
