# The craftkit host: one Java mod per loader that loads Rust mods. Every property here is also
# expanded into the manifests by build-logic's multiloader-common.gradle.
# Confirmed from meta.fabricmc.net, maven.neoforged.net, Modrinth and the 26.3
# branches of Fabric's example mod and the MultiLoader template; docs/development.md's table
# names the same versions and VersionsTest keeps the places agreeing.

version=0.1.2
group=craftkit
java_version=25

minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
mod_name=craftkit
mod_author=razor
mod_id=craftkit
license=MIT
description=Loads mods written in Rust. Working name.
# The vanilla mappings the common project compiles against: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

fabric_version=0.165.2+26.3
fabric_loader_version=0.20.1
loom_version=1.19.4

neoforge_version=26.3.0.101
neoforge_loader_version_range=[4,)
moddev_version=2.0.148

# XZ for Java, which unpacks the compressed natives (0BSD).
xz_version=1.10

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
