plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

neoForge {
	// Vanilla with Mojang's mappings, which both loaders use since 26.x, so common code compiles
	// once against the game and each loader adds only its own entry point and events.
	neoFormVersion = neo_form_version
}

repositories {
	// Mixin's annotations, for the render hooks common code shares with both loaders; each loader
	// brings Mixin itself at run time, so it is only compiled against here.
	exclusiveContent {
		forRepository {
			maven {
				name = 'Fabric'
				url = uri('https://maven.fabricmc.net')
			}
		}
		filter {
			includeGroup('net.fabricmc')
		}
	}
}

dependencies {
	// XZ for Java (0BSD): the natives are xz-compressed in a release jar, half the size of the
	// jar's own deflate. Bundled by each loader's jar (Fabric's include, NeoForge's jarJar).
	implementation "org.tukaani:xz:${xz_version}"
	compileOnly 'net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7'
	// MixinExtras, which both loaders ship: red rain wraps the drops' colour call, as Subtle
	// Effects' biome-coloured rain does, and must run after it.
	compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
	// Gson is the game's own, on the compile classpath through NeoForm, but the JUnit runtime
	// classpath does not get the game's libraries; the tests that parse manifests need it.
	testImplementation 'com.google.code.gson:gson:2.14.0'
	// The same for the logger: slf4j is the game's; the tests need the API (no binding, so
	// the host's lines are dropped in tests, which is fine).
	testImplementation 'org.slf4j:slf4j-api:2.0.17'
	// DataFixerUpper, the game's codecs: SavedMemoryTest encodes the saved memory as the game would.
	testImplementation 'com.mojang:datafixerupper:10.0.21'
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'common')
			}
		}
	}
}
