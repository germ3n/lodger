# Run by hand (owner): Actions, ci, Run workflow. The checks on three systems, then each native
# built by the same script as on a developer's Mac (scripts/build_natives.py), then the two
# lodger jars with the six natives xz-compressed inside (scripts/build_jars.py). docs/build.md
# describes it; VersionsTest checks the pins here agree with rust-toolchain.toml and the
# gradle.properties files.
name: ci
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (empty: v<mod version>-<run number>)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false 

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # The checks build on Windows with MSVC itself, where llama.cpp's CMake build keeps the
    # dynamic C runtime whatever it is asked: so Rust's is dynamic here too (the CRT's imports
    # were left unresolved against the static one). RUSTFLAGS, once set, stands in for every
    # `target.*.rustflags` of `.cargo/config.toml` (a CARGO_TARGET_..._RUSTFLAGS is merged with
    # them, and crt-static stayed). The natives a player gets are cross-built with the runtime
    # inside, below; these builds ship nowhere.
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-cpu=x86-64-v3' || '' }}
      LLAMA_STATIC_CRT: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Both macOS natives (Metal; Intel cross-built on the Apple chip), and both Windows natives
  # (Vulkan) cross-built with cargo-xwin, as on a developer's Mac.
  natives-mac-windows:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: brew install llvm lld shaderc
      - run: cargo install cargo-xwin --locked
      - run: python3 scripts/build_natives.py macos-aarch64 macos-x86_64 windows-x86_64 windows-aarch64 --out natives
      - run: find natives -type f -exec shasum -a 256 {} \;
      - uses: actions/upload-artifact@v7
        with:
          name: natives-mac-windows
          path: natives/
          if-no-files-found: error

  # Each Linux native (Vulkan) in scripts/cross/linux.Dockerfile, on a runner of its own chip.
  natives-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/build_natives.py ${{ matrix.platform }} --out natives
      - run: find natives -type f -exec sha256sum {} \;
      - uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.platform }}
          path: natives/
          if-no-files-found: error

  # The host for both loaders with its tests, then the two lodger jars with the six natives.
  jars:
    needs: [checks, natives-mac-windows, natives-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true
      - run: find natives -type f
      - run: python3 scripts/build_jars.py 26.3 --natives natives
      # Each native as built and as packed, and both jars, on the run's summary page too.
      - name: SHA-256 of every native and jar
        run: |
          cat dist/26.3/SHA256SUMS
          {
            echo '## SHA-256'
            echo
            echo '| SHA-256 | File |'
            echo '| --- | --- |'
            awk '{ print "| `" $1 "` | `" $2 "` |" }' dist/26.3/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lodger-jars
          path: dist/
          if-no-files-found: error

  # A GitHub release of the run: the six natives (each named by its platform), both jars and
  # SHA256SUMS, with every file's SHA-256 in its notes.
  release:
    needs: [jars]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: lodger-jars
          path: dist
      - name: gather the files and their sums
        id: files
        run: |
          mkdir release
          for dir in natives/*/; do
            platform=$(basename "$dir")
            for lib in "$dir"*; do
              name=$(basename "$lib")
              stem=${name%.*}
              stem=${stem#lib}
              cp "$lib" "release/${stem}-${platform}.${name##*.}"
            done
          done
          cp dist/26.3/*.jar release/
          (cd release && sha256sum * > SHA256SUMS)
          version=$(grep '^version=' mod/gradle.properties | cut -d= -f2)
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="v${version}-${{ github.run_number }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "The lodger ${version} for Minecraft 26.3: one jar per loader, each carrying all six natives (Windows and Linux on x86_64 and arm64 with Vulkan, macOS on Apple silicon and Intel with Metal). Install the jar for your loader; the natives are here on their own as well."
            echo
            echo "Built from ${GITHUB_SHA}."
            echo
            echo "| SHA-256 | File |"
            echo "| --- | --- |"
            awk '{ print "| `" $1 "` | `" $2 "` |" }' release/SHA256SUMS
          } > notes.md
          cat notes.md
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.files.outputs.tag }}" release/* \
            --target "$GITHUB_SHA" \
            --title "${{ steps.files.outputs.tag }}" \
            --notes-file notes.md \
            ${{ inputs.prerelease && '--prerelease' || '' }}
