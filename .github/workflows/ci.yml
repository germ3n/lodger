# The Rust side (the SDK and the lodger's mind) on each platform a content jar carries a native
# for, the host for both loaders, then the lodger's content jar with all three natives in it.
# docs/development.md describes the layout; VersionsTest checks the pins here agree with
# rust-toolchain.toml and the gradle.properties files.
name: ci
on: [push, pull_request]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-aarch64
            library: liblodger_core.dylib
          - os: ubuntu-24.04
            platform: linux-x86_64
            library: liblodger_core.so
          - os: windows-latest
            platform: windows-x86_64
            library: lodger_core.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p lodger-core
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: target/release/${{ matrix.library }}
          if-no-files-found: error

  host:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: craftkit-jars
          path: |
            host/fabric/build/libs/
            host/neoforge/build/libs/

  lodger-jar:
    needs: rust
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/download-artifact@v6
        with:
          pattern: native-*
          path: mod/natives-extra
      - name: lay the natives out as natives-extra/<os>-<arch>/
        run: |
          for dir in natives-extra/native-*; do
            mv "$dir" "natives-extra/${dir#natives-extra/native-}"
          done
          find natives-extra -type f
      - name: build without cargo, so the jar's natives are the three above and nothing else
        run: CARGO=/nonexistent ./gradlew jar --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: lodger-jar
          path: mod/build/libs/
