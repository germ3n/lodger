# The Rust side (the SDK and the lodger's mind) on the six platforms a lodger jar carries a native
# for, the host for both loaders, then the two lodger jars with all six natives and the host
# nested in each. docs/development.md describes the layout; VersionsTest checks the pins here
# agree with rust-toolchain.toml and the gradle.properties files.
name: ci
on: [push, pull_request]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-aarch64
            library: liblodger_core.dylib
          - os: macos-15-intel
            platform: macos-x86_64
            library: liblodger_core.dylib
          # 22.04, not 24.04: a library built on 24.04's glibc 2.39 does not load on Debian 12 or
          # Ubuntu 22.04, which many servers run.
          - os: ubuntu-22.04
            platform: linux-x86_64
            library: liblodger_core.so
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
            library: liblodger_core.so
          - os: windows-latest
            platform: windows-x86_64
            library: lodger_core.dll
          - os: windows-11-arm
            platform: windows-aarch64
            library: lodger_core.dll
            # llama.cpp refuses MSVC's own compiler on ARM without GGML_NATIVE, which the
            # crate turns off: built with clang-cl through Ninja in the developer prompt.
            clang: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: matrix.clang
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - if: matrix.clang
        shell: bash
        run: |
          echo "CC=clang-cl" >> "$GITHUB_ENV"
          echo "CXX=clang-cl" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p lodger-core
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: target/release/${{ matrix.library }}
          if-no-files-found: error

  host:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: craftkit-jars
          path: |
            host/fabric/build/libs/craftkit-fabric-*.jar
            host/neoforge/build/libs/craftkit-neoforge-*.jar

  lodger-jars:
    needs: [rust, host]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/download-artifact@v6
        with:
          pattern: native-*
          path: mod/natives-extra
      - uses: actions/download-artifact@v6
        with:
          name: craftkit-jars
          path: mod/host-jars-tree
      - name: lay the natives out as natives-extra/<os>-<arch>/ and the host jars in host-jars/
        run: |
          for dir in natives-extra/native-*; do
            mv "$dir" "natives-extra/${dir#natives-extra/native-}"
          done
          mkdir -p host-jars
          find host-jars-tree -name 'craftkit-*.jar' ! -name '*-sources.jar' -exec mv {} host-jars/ \;
          find natives-extra host-jars -type f
      - name: build without cargo, so the jars' natives are the six above and nothing else
        run: CARGO=/nonexistent ./gradlew jar --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: lodger-jars
          path: mod/build/libs/
