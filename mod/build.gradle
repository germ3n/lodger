// The lodger's jars: one per loader, each carrying the craftkit host nested inside it (Fabric's
// `jars`, NeoForge's jar-in-jar), the mind's natives (this machine's, plain, for a developer;
// all five, xz-compressed, from scripts/build_jars.py), the assets and the manifests. No Java
// of the lodger's own. Players install one file; two Rust mods on one server share the newest
// nested host, which both loaders work out themselves. See docs/build.md.
//
// The host jars come from host/: run `./gradlew build` there first (build_jars.py does).
plugins {
	id 'base'
}

def repo = file('..')
def cargo = System.getenv('CARGO') ?: 'cargo'
def cargoOnPath = {
	try {
		def proc = [cargo, '--version'].execute()
		proc.waitFor() == 0
	} catch (Exception ignored) {
		false
	}
}

// The same names host's Natives.java works out at runtime.
def hostOs = {
	def name = System.getProperty('os.name').toLowerCase()
	name.contains('mac') ? 'macos' : name.contains('win') ? 'windows' : 'linux'
}()
def hostArch = {
	def arch = System.getProperty('os.arch')
	(arch == 'aarch64' || arch == 'arm64') ? 'aarch64' : (arch == 'amd64' || arch == 'x86_64') ? 'x86_64' : arch
}()
def library = hostOs == 'macos' ? 'liblodger_core.dylib' : hostOs == 'windows' ? 'lodger_core.dll' : 'liblodger_core.so'

// Where a loader's host jar is: the CI drops them in host-jars/, a developer builds host/.
def hostJar = { String loader ->
	def dropped = fileTree(dir: 'host-jars', include: "craftkit-${loader}-*.jar", exclude: '*-sources.jar')
	if (!dropped.isEmpty()) {
		return dropped.singleFile
	}
	def built = fileTree(dir: new File(repo, "host/${loader}/build/libs"), include: "craftkit-${loader}-*.jar", exclude: '*-sources.jar')
	if (!built.isEmpty()) {
		return built.singleFile
	}
	throw new GradleException("no craftkit-${loader} jar: run ./gradlew build in host/ first, or put one in mod/host-jars/")
}

tasks.register('cargoBuild', Exec) {
	description = 'Builds the mind (core/) as a release shared library.'
	workingDir repo
	commandLine cargo, 'build', '--release', '-p', 'lodger-core'
	onlyIf { cargoOnPath() }
	inputs.files(fileTree(repo) { include 'Cargo.toml', 'Cargo.lock', 'core/**', 'sdk/**'; exclude '**/target/**' })
	outputs.file(new File(repo, "target/release/${library}"))
}

def expandProps = { project.properties.findAll { k, v -> v instanceof String } }

tasks.register('processResources', Sync) {
	description = 'Fills the shared manifests in with the versions.'
	from('src/main/resources') {
		filesMatching(['pack.mcmeta']) {
			expand(expandProps())
		}
	}
	into layout.buildDirectory.dir('resources')
}

// One jar task per loader. Each takes the shared resources, this loader's manifest, the host
// jar nested, the host native and natives-extra/.
['fabric', 'neoforge'].each { loader ->
	def manifestTask = tasks.register("${loader}Manifest", Copy) {
		description = "Fills in the ${loader} manifest."
		from("src/${loader}/resources") {
			filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json']) {
				def props = expandProps()
				props['craftkit_jar'] = hostJar(loader).name
				expand(props)
			}
		}
		into layout.buildDirectory.dir("manifest-${loader}")
	}

	tasks.register("${loader}Jar", Jar) {
		description = "The lodger for ${loader}, with the craftkit host nested."
		dependsOn 'cargoBuild', 'processResources', manifestTask
		archiveBaseName = "lodger-${loader}"
		archiveVersion = "${project.minecraft_version}-${project.version}"
		destinationDirectory = layout.buildDirectory.dir('libs')
		from(layout.buildDirectory.dir('resources'))
		from(layout.buildDirectory.dir("manifest-${loader}"))
		// The one built here, unless every native comes from natives-extra/ (`-PnativesOnly`,
		// scripts/build_jars.py), or natives-extra/ has this platform's: two of one platform would
		// be a duplicate entry.
		if (project.findProperty('nativesOnly') != 'true' && !file("natives-extra/${hostOs}-${hostArch}").exists()) {
			from(new File(repo, "target/release/${library}")) {
				into "natives/${hostOs}-${hostArch}"
			}
		}
		// scripts/build_jars.py drops the natives in natives-extra/<os>-<arch>/<library>.xz first.
		from(file('natives-extra')) {
			into 'natives'
		}
		from({ hostJar(loader) }) {
			into loader == 'fabric' ? 'META-INF/jars' : 'META-INF/jarjar'
		}
		from(new File(repo, 'LICENSE')) {
			rename { "${it}_lodger" }
		}
		// The notices for what the jar carries (`gen_notices.py` at the root writes them).
		from(new File(repo, 'THIRD_PARTY_NOTICES.txt'))
	}
}

tasks.register('jar') {
	description = 'Both lodger jars.'
	dependsOn 'fabricJar', 'neoforgeJar'
}

assemble.dependsOn 'jar'
