# The lodger's content jar: no Java, only the mind's natives, the assets and the manifests both
# loaders read. The version is the mind's (core/Cargo.toml); the Minecraft and loader values are
# the host's (host/gradle.properties). VersionsTest in the host keeps them agreeing.
version=0.1.2
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
fabric_loader_version=0.20.1
neoforge_loader_version_range=[4,)
craftkit_version=0.1.2

org.gradle.jvmargs=-Xmx512M
