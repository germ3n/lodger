[package]
name = "lodger-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The mind of the lodger: what it knows and what it decides. A craftkit mod, built as a shared library the host loads."
publish = false

[lib]
name = "lodger_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
craftkit = { path = "../sdk" }
serde.workspace = true
serde_json.workspace = true
