# The Rust side: the SDK every Rust mod is written against, and the lodger's mind, its first
# consumer. The Java host (host/) and the lodger's content jar (mod/) are Gradle projects.
[workspace]
resolver = "2"
members = ["sdk", "core"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/germ3n/lodger"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# The SDK's exported functions catch panics before they could cross into Java (sdk/src/abi.rs),
# so aborting would only lose the message. Unwind, and let catch_unwind turn it into an error.
panic = "unwind"
